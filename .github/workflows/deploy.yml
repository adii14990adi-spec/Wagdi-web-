name: Deploy Static Web to GitHub Pages

on:
  push:
    branches:
      - arena/ac1306bd-wagdi-web  # Current active branch
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'  # Project root folder jisme index.html aur data.json hai

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
